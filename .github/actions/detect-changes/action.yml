name: "Detect Changes"
description: "Detect if files in a given path have changed"
inputs:
  paths:
    description: "Comma-separated list of paths or files to check for changes (e.g. 'src,docs/file.txt')"
    required: true

outputs:
  changed:
    description: "Whether any of the paths/files have changed"
    value: ${{ steps.detect.outputs.changed }}

runs:
  using: "composite"
  steps:
    - name: Detect changes in path
      id: detect
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff_range="origin/${{ github.base_ref }}...HEAD"
        elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
          diff_range="HEAD^..HEAD"
        else
          diff_range="$(git hash-object -t tree /dev/null)..HEAD"
        fi

        changed=false
        IFS=',' read -ra paths <<< "$INPUT_PATHS"
        mapfile -t changed_files < <(git diff --name-only "$diff_range")
        for path in "${paths[@]}"; do
          path_trimmed=$(printf '%s' "$path" | xargs)
          if [ -z "$path_trimmed" ]; then
            continue
          fi
          for changed_file in "${changed_files[@]}"; do
            if [ "$changed_file" = "$path_trimmed" ] || [[ "$changed_file" == "$path_trimmed/"* ]]; then
              changed=true
              break 2
            fi
          done
        done

        echo "changed=$changed" >> "$GITHUB_OUTPUT"
